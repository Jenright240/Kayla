<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Launch Countdown!</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f0f2f5; /* Light, clean background */
      margin: 0;
      text-align: center;
      color: #333;
    }
    .container {
      background-color: #ffffff;
      padding: 40px 50px;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }
    h1 {
      color: #0056b3; /* A professional blue */
      margin-bottom: 20px;
      font-size: 2.5em;
    }
    #countdown {
      font-size: 3em;
      font-weight: bold;
      color: #28a745; /* A vibrant green for excitement */
      margin-top: 20px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.05);
    }
    p.message {
      font-size: 1.1em;
      color: #555;
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>[YOUR COMPANY NAME] is Launching Soon!</h1>
    <div id="countdown"></div>
    <p class="message">Get ready for something amazing!</p>
  </div>

  <script>
    // --- CONFIGURE YOUR LAUNCH DATE AND TIME HERE ---
    // Format: YYYY-MM-DDTHH:MM:SSZ (Z indicates UTC)
    // Example: For August 15, 2024 at 10:00 AM UTC
    const launchDate = new Date("2024-08-15T10:00:00Z").getTime();

    const countdownInterval = setInterval(function() {
      const now = new Date().getTime();
      const distance = launchDate - now;

      if (distance < 0) {
        clearInterval(countdownInterval);
        document.getElementById("countdown").innerHTML = "We are LIVE!";
        // Optional: Redirect after a few seconds to your main website
        // setTimeout(function() { window.location.href = "https://your-main-website.com"; }, 5000);
        return;
      }

      // Calculations for days, hours, minutes, seconds
      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      // Display the result
      document.getElementById("countdown").innerHTML = `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }, 1000); // Update the countdown every second
  </script>

</body>
</html>
